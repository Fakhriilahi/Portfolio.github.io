<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fakhreddine Elahi — 3D Stack</title>
<style>
  body { margin: 0; background: #0c0c0e; color: #fff; font-family: sans-serif; overflow-x: hidden; }
  .container { position: relative; width: 100vw; height: 100vh; }
  #canvas3d { width: 100%; height: 100%; display: block; }
  .title {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 5rem; font-weight: 900; opacity: 0.15; pointer-events: none;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="container">
  <div class="title">MY TOOLKIT</div>
  <canvas id="canvas3d"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

<script>
(function() {
  const canvas = document.getElementById('canvas3d');
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 15);

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // LIGHTING FOR GLOSSY WHITE SPHERES
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
  scene.add(ambientLight);

  const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight1.position.set(10, 15, 10);
  dirLight1.castShadow = true;
  scene.add(dirLight1);

  const dirLight2 = new THREE.DirectionalLight(0x7b00ff, 0.5); // Subtle purple rim light
  dirLight2.position.set(-10, -10, -5);
  scene.add(dirLight2);

  // PHYSICS
  const world = new CANNON.World();
  world.gravity.set(0, 0, 0);

  const skills = ["Python", "Power BI", "SQL", "Tableau", "SLA/KPI", "Excel", "Data", "Process", "Root-Cause"];
  const meshes = [];
  const bodies = [];

  function createTexture(text) {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    
    // Smooth White Plastic Look
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 512, 512);

    ctx.fillStyle = '#111111';
    ctx.font = 'Bold 70px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 256, 256);

    const tex = new THREE.CanvasTexture(c);
    return tex;
  }

  const radius = 1.2;
  const geo = new THREE.SphereGeometry(radius, 64, 64);

  skills.forEach((skill) => {
    const mat = new THREE.MeshPhysicalMaterial({
      map: createTexture(skill),
      roughness: 0.1,      // Shiny / Glossy
      metalness: 0.05,
      clearcoat: 1.0,      // Extra shine coat (like moncy.dev)
      clearcoatRoughness: 0.1
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    meshes.push(mesh);

    const shape = new CANNON.Sphere(radius);
    const body = new CANNON.Body({
      mass: 1,
      shape: shape,
      linearDamping: 0.6,
      angularDamping: 0.6,
      position: new CANNON.Vec3((Math.random()-0.5)*4, (Math.random()-0.5)*4, (Math.random()-0.5)*2)
    });
    world.addBody(body);
    bodies.push(body);
  });

  // MOUSE
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2(-999, -999);

  window.addEventListener('mousemove', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  });

  function animate() {
    requestAnimationFrame(animate);
    world.step(1/60);

    bodies.forEach((body, i) => {
      // Pull to center
      body.force.x -= body.position.x * 2.0;
      body.force.y -= body.position.y * 2.0;
      body.force.z -= body.position.z * 2.0;

      meshes[i].position.copy(body.position);
      meshes[i].quaternion.copy(body.quaternion);
    });

    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(meshes);
    if(hits.length > 0) {
      const idx = meshes.indexOf(hits[0].object);
      if(idx !== -1) {
        bodies[idx].applyImpulse(
          new CANNON.Vec3((Math.random()-0.5)*2, (Math.random()-0.5)*2, 2),
          bodies[idx].position
        );
      }
    }

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
