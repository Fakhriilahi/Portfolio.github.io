<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fakhreddine Elahi — Business &amp; IT Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f9fa;
  --text: #111111;
  --accent: #6366f1;
  --line: rgba(0,0,0,0.08);
  --f-display: 'Space Grotesk', sans-serif;
  --f-body: 'Inter', sans-serif;
  --f-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--f-body); overflow-x: hidden; }

/* HEADER */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 5%; background: rgba(248, 249, 250, 0.85); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.logo { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }
nav a { margin-left: 25px; text-decoration: none; color: var(--text); font-weight: 500; font-size: 0.9rem; }

/* SECTIONS */
section { padding: 100px 5%; border-bottom: 1px solid var(--line); }
.hero { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; }
.hero h1 { font-family: var(--f-display); font-size: clamp(2.8rem, 7vw, 5.5rem); line-height: 1.05; }
.hero h1 span { color: var(--accent); }
.hero p { max-width: 600px; margin-top: 20px; font-size: 1.2rem; color: #555; }

.section-title { font-family: var(--f-display); font-size: 2.2rem; margin-bottom: 30px; }

/* 3D CANVAS TOOLKIT CONTAINER */
.toolkit-container {
  position: relative;
  width: 100%;
  height: 520px;
  background: #ffffff;
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 20px 40px rgba(0,0,0,0.03);
}

#three-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.toolkit-instruction {
  position: absolute; bottom: 15px; left: 20px;
  font-family: var(--f-mono); font-size: 0.75rem; color: #888;
  pointer-events: none;
}
</style>
</head>
<body>

<header>
  <div class="logo">F.ELAHI</div>
  <nav>
    <a href="#about">About</a>
    <a href="#experience">Experience</a>
    <a href="#skills">Toolkit 3D</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="hero">
  <h1>Business &amp; IT <span>Analytics</span></h1>
  <p>Junior Business/IT Analyst turning high-volume operations into clear structured decisions.</p>
</section>

<section id="skills">
  <h2 class="section-title">Interactive 3D Toolkit</h2>
  
  <!-- CONTAINER FOR THE 3D SPHERES (MONCY.DEV STYLE) -->
  <div class="toolkit-container">
    <canvas id="three-canvas"></canvas>
    <div class="toolkit-instruction">💡 Grab or hover over the 3D skill spheres</div>
  </div>
</section>

<!-- THREE.JS + CANNON.JS FOR REAL 3D PHYSICS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

<script>
// --- 3D PHYSICS BUBBLE CLOUD (MONCY.DEV STYLE) ---
(function() {
  const container = document.querySelector('.toolkit-container');
  const canvas = document.getElementById('three-canvas');

  // 1. THREE.JS SCENE SETUP
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff); // White Background

  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 0, 18);

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;

  // LIGHTS
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(10, 20, 15);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // 2. CANNON.JS PHYSICS WORLD
  const world = new CANNON.World();
  world.gravity.set(0, 0, 0); // Zero gravity so spheres float together in a cluster!

  // SKILLS LIST & TEXTURES
  const skills = ["Python", "Power BI", "SQL", "Tableau", "Process", "SLA/KPI", "Excel", "Data", "Root-Cause"];
  const sphereMeshes = [];
  const sphereBodies = [];

  // FUNCTION TO CREATE TEXTURE CANVAS FOR SPHERES
  function createTextTexture(text) {
    const canvasText = document.createElement('canvas');
    canvasText.width = 512;
    canvasText.height = 512;
    const ctx = canvasText.getContext('2d');

    ctx.fillStyle = '#f4f4f6';
    ctx.fillRect(0, 0, 512, 512);

    // Circle border
    ctx.lineWidth = 16;
    ctx.strokeStyle = '#6366f1';
    ctx.strokeRect(0, 0, 512, 512);

    // Text
    ctx.fillStyle = '#111111';
    ctx.font = 'Bold 60px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 256, 256);

    return new THREE.CanvasTexture(canvasText);
  }

  // CREATE SPHERES WITH PHYSICS
  const sphereRadius = 1.3;
  const geometry = new THREE.SphereGeometry(sphereRadius, 32, 32);

  skills.forEach((skill, index) => {
    // Three.js Mesh
    const texture = createTextTexture(skill);
    const material = new THREE.MeshStandardMaterial({
      map: texture,
      roughness: 0.2,
      metalness: 0.1
    });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);
    sphereMeshes.push(mesh);

    // Cannon.js Physics Body
    const shape = new CANNON.Sphere(sphereRadius);
    const body = new CANNON.Body({
      mass: 1,
      shape: shape,
      position: new CANNON.Vec3(
        (Math.random() - 0.5) * 6,
        (Math.random() - 0.5) * 6,
        (Math.random() - 0.5) * 4
      )
    });
    world.addBody(body);
    sphereBodies.push(body);
  });

  // MOUSE INTERACTION (Attract/Repel spheres)
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2(-999, -999);

  container.addEventListener('mousemove', (e) => {
    const rect = container.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;
  });

  // ANIMATION LOOP
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    world.step(1 / 60);

    // Pull spheres toward the center (attraction cluster effect)
    sphereBodies.forEach((body, i) => {
      // Central force
      body.force.x -= body.position.x * 1.5;
      body.force.y -= body.position.y * 1.5;
      body.force.z -= body.position.z * 1.5;

      // Update Three.js positions from Physics
      sphereMeshes[i].position.copy(body.position);
      sphereMeshes[i].quaternion.copy(body.quaternion);
    });

    // Mouse Interaction Physics
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(sphereMeshes);
    if(intersects.length > 0) {
      const hitIndex = sphereMeshes.indexOf(intersects[0].object);
      if(hitIndex !== -1) {
        sphereBodies[hitIndex].applyImpulse(
          new CANNON.Vec3((Math.random()-0.5)*4, (Math.random()-0.5)*4, 4),
          sphereBodies[hitIndex].position
        );
      }
    }

    renderer.render(scene, camera);
  }

  animate();

  // RESIZE
  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
})();
</script>
</body>
</html>
